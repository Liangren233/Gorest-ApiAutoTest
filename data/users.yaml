- name: 查询用户列表并提取首个ID
  request:
    method: GET
    url: /users?page=1&per_page=1
  expects:
    status: 200
    schema:
      id:
        type: int
      name:
        type: str
  extract:
    user_id: $.id

- name: 查询提取到的ID对应的用户
  request:
    method: GET
    url: /users/${user_id}
  expects:
    status: 200
    schema:
      id:
        type: int
      email:
        type: str